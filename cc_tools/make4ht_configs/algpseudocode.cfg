% algpseudocode.cfg — make4ht configuration for algorithmic/algpseudocode environments
% Supplied by Michal Hoftich (michal-h21) in response to
% https://github.com/michal-h21/make4ht/issues/190
% Replaces deeply nested <span> wrappers with clean <strong class="keyword"> markup.
% Pass to make4ht with: make4ht -c /path/to/algpseudocode.cfg tex_name mathjax ...
\Preamble{xhtml,mathjax}
\begin{document}
\catcode`\:=11
\makeatletter

\ConfigureEnv{algorithmic}
   {\ifvmode \IgnorePar\fi \EndP
    \HCode{<div \a:LRdir class="algorithmic">}%
    \bgroup\NoFonts%
      \Configure{textbf}{\HCode{<strong class="keyword">}}{\HCode{</strong>}}%
      \Configure{textit}{\HCode{<em class="variable">}}{\HCode{</em>}}%
      \Configure{textsc}{\HCode{<span class="smallcaps">}}{\HCode{</span>}}%
       \Configure{HtmlPar}
         {\EndP}
         {\EndP}
         {}
         {}%
   }
   {\EndNoFonts\egroup
    \ifvmode\IgnorePar\fi\EndP\HCode{</div>}\par\ShowPar
   }
   {}{}
\ConfigureList{algorithmic}%
   {\EndP
    \PushMacro\end:itm
    \global\let\end:itm=\empty}
   {\PopMacro\end:itm \global\let\end:itm \end:itm
    \EndP
    \special{t4ht@.}%
    \HCode{</span></div>\Hnewline}%
   }%
   {\end:itm%
    \HCode{\ifx \end:itm\empty\else \fi%
      \ifx\ALG@text\ALG@x@notext<div class="empty">\else<div class="line">\fi%
    <span class="label label-\the\labelwidth">}%
            \global\def\end:itm{\EndP\special{t4ht@,}\special{t4ht@.}\HCode{</span></div>\Hnewline}\special{t4ht@. }}%
    \ifnum \c@ALG@line=10
      \Css{.algorithmic span.label{min-width:3rem; text-align:left;display: inline-block;margin-left:-4rem;}}
    \fi
   }
   {\HCode{</span><span\Hnewline class="algorithmic-content">}\AnchorLabel%
    \special{t4ht@. }}
\Css{div.algorithmic span.algorithmic-content{white-space:pre-wrap;display: inline-block;padding-left: 1rem;}}
\Css{.algorithmic div.empty {display: none;}}
\Css{span.smallcaps {font-variant:small-caps;}}

\makeatother
\catcode`\:=12
\EndPreamble
