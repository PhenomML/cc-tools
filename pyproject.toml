[project]
name = "cc-tools"
version = "0.2.0"
description = "Standard Claude Code toolset — portable across all PhenomML systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=3.0.0",
    "markitdown[all]>=0.1.5",
    "nbconvert>=7.17.1",
    "pdfplumber>=0.11.9",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
cc-markitdown = "cc_tools.markitdown:main_wrapper"
cc-md2pdf     = "cc_tools.md2pdf:main"
cc-nbconvert  = "nbconvert.nbconvertapp:main"
cc-pdfplumber = "pdfplumber.cli:main"
cc-webfetch   = "cc_tools.webfetch:main"
cc-arxiv      = "cc_tools.arxiv_fetch:main"
cc-fetch      = "cc_tools.fetch:main"
cc-wiki-brief    = "cc_tools.wiki_brief_start:main"
cc-dropbox-sync  = "cc_tools.dropbox_sync:main"
cc-ocr           = "cc_tools.ocr:main"
cc-safari-fetch       = "cc_tools.safari_fetch:main"
cc-semantic-scholar   = "cc_tools.semantic_scholar:main"
cc-distill-fetch      = "cc_tools.distill_fetch:main"
cc-wiki-grep          = "cc_tools.wiki_grep:main"

[tool.setuptools.packages.find]
include = ["cc_tools*"]

[tool.setuptools.package-data]
cc_tools = ["make4ht_configs/*.4ht", "make4ht_configs/*.cfg", "make4ht_configs/*.tex"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
]
